spring.application.name=actividades-api

server.port=8181

# MySQL
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/gestion_actividades
spring.datasource.username=root
spring.datasource.password=3710belA;
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Almacenamiento local de imágenes
storage.local.base-path=uploads/actividades
storage.local.base-url=http://localhost:8181/uploads/actividades

# Servir archivos estáticos desde la carpeta uploads del proyecto
spring.web.resources.static-locations=file:uploads/

# Subida de archivos (límites)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
#  Propiedades a agregar / modificar en application.properties
# ============================================================

# --- Frontend URL (para construir el enlace de recuperacion) ---
app.frontend.url=http://localhost:4200

