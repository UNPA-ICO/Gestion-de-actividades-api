spring.application.name=actividades-api

server.port=${SERVER_PORT:8181}

# MySQL
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:gestion_actividades}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Almacenamiento local de imágenes
storage.local.base-path=${STORAGE_BASE_PATH:uploads/actividades}
storage.local.base-url=${STORAGE_BASE_URL:http://localhost:8181/uploads/actividades}

# Servir archivos estáticos desde la carpeta uploads del proyecto
spring.web.resources.static-locations=file:uploads/

# Subida de archivos (límites)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Frontend URL (para construir el enlace de recuperacion) ---
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# --- Modo simulado de correo (true = no envia correo real) ---
# Cambiar a false en produccion (vía variable de entorno MAIL_SIMULADO) y configurar SMTP abajo
mail.simulado=${MAIL_SIMULADO:true}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}

# --- Configuracion SMTP ---
correo.smtp.habilitado=${CORREO_SMTP_HABILITADO:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
correo.remitente=${MAIL_USERNAME}

# CORS (usado en WebConfig)
# Para varios origenes (ej. con y sin www, o staging + prod), separalos por coma:
# CORS_ALLOWED_ORIGIN=https://midominio.com,https://www.midominio.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:4200}